<script>
/* The portfolio moved from civfarmer.github.io/CV/ to civfarmer.github.io/. Anything that used to live under /CV/
   and has no forwarding page of its own (a generated Meridian page, a PDF, an image) is sent to the same path at the
   new address. If that does not exist either, the main site's own 404 page takes over. */
(function(){
  var p = location.pathname.replace(/^\/CV(\/|$)/i, '/');
  location.replace('https://civfarmer.github.io' + p + location.search + location.hash);
})();
</script>

<!-- GitHub Pages serves this file for any missing path under the site, at any depth, so the

     them against the missing path first. -->
<script>(function(){var r=location.pathname.indexOf('/CV/')===0?'/CV/':'/',h=document.head;
function css(x){var l=document.createElement('link');l.rel='stylesheet';l.href=r+x;h.appendChild(l);}

var c=document.createElement('script');c.src=r+'assets/consent.js';c.defer=true;h.appendChild(c);
var b=document.createElement('base');b.href=r;h.appendChild(b);
try{var t=localStorage.getItem('cf-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)t='light';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  :root{--bg:#0b0f17;--bg2:#0e1420;--surface:#131b2a;--ink:#e9eef7;--ink2:#aab7cc;--muted:#7d8ba3;--line:#233145;--line2:#2c3d54;

  html[data-theme="light"]{--bg:#f4f1ec;--bg2:#ebe6dd;--surface:#fff;--ink:#221e18;--ink2:#4c473e;--muted:#675f54;--line:#e7e1d6;--line2:#d9d2c5;--accent:#0d5f57;--gold:#836819;--shadow:0 18px 44px -24px rgba(15,30,60,.35)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  a{color:inherit}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg2) 82%,transparent);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .crest{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#2a8f85);color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px}
  .brand .nm{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.1}
  .brand .rl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:13.5px;text-decoration:none;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  .btn.icon{width:40px;padding:0;justify-content:center}
  .btn svg{width:16px;height:16px}
  .btn.gold{color:#20180a;background:linear-gradient(145deg,var(--gold),#e6cf8f);border-color:transparent}
  main{flex:1;display:grid;place-items:center;padding:48px 16px 96px}
  .card{max-width:560px;width:100%;background:color-mix(in oklab,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:16px;padding:34px 30px;box-shadow:var(--shadow)}
  .code{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:10px 0 8px}
  p{margin:0 0 20px;color:var(--ink2)}
  .links{display:flex;flex-wrap:wrap;gap:10px}
  @media(max-width:480px){.card{padding:26px 20px}.links .btn{flex:1 1 100%;justify-content:center}}
</style>
</head>
